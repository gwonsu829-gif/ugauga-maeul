<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>우가우가마을</title>
<meta name="description" content="팔로우하면 원시시대 마을에 내 집 한 채와 공룡 알 하나가 생겨요.">
<style>
  :root { --stone:#e4d9c4; --ink:#2e2418; --edge:#6b5a45; --gold:#f2b632; }
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; overflow:hidden; background:#f2b27a;
    font-family:Pretendard,"Apple SD Gothic Neo","Malgun Gothic",sans-serif; color:var(--ink); }
  canvas { position:fixed; inset:0; width:100%; height:100%; display:block; touch-action:none; }
  .box { background:var(--stone); border:2px solid var(--edge); border-radius:14px; box-shadow:0 4px 0 rgba(46,36,24,.35); }
  #hud { position:fixed; top:12px; left:12px; padding:10px 14px; max-width:62vw; }
  #hud h1 { margin:0; font-size:18px; }
  #hud p { margin:2px 0 0; font-size:13px; }
  button, .btn { font:inherit; font-weight:700; cursor:pointer; color:var(--ink); padding:10px 14px;
    background:var(--gold); border:2px solid var(--edge); border-radius:12px; text-decoration:none; display:inline-block; }
  #join { position:fixed; top:12px; right:12px; }
  #find { position:fixed; left:50%; bottom:14px; transform:translateX(-50%); display:flex; gap:6px; padding:8px; width:min(360px,92vw); }
  #find input { flex:1; min-width:0; font:inherit; padding:8px 10px; border:2px solid var(--edge); border-radius:10px; background:#fff; }
  #card { position:fixed; left:50%; bottom:84px; transform:translateX(-50%); padding:12px 16px; width:min(320px,92vw); text-align:center; }
  #card b { font-size:18px; display:block; overflow-wrap:anywhere; }
  #card p { margin:4px 0 10px; font-size:13px; }
  #card .x { position:absolute; top:6px; right:6px; padding:2px 8px; background:none; border:none; }
  dialog { padding:18px; width:min(340px,92vw); color:var(--ink); }
  dialog::backdrop { background:rgba(46,36,24,.5); }
  dialog h2 { margin:0 0 8px; font-size:18px; }
  dialog ol { margin:0 0 10px; padding-left:20px; line-height:1.7; font-size:14px; }
  dialog p { font-size:13px; margin:0 0 12px; }
  dialog .row { display:flex; gap:8px; justify-content:flex-end; }
  .ghost { background:none; }
  [hidden] { display:none !important; }
</style>
</head>
<body>
<canvas id="c"></canvas>

<header id="hud" class="box">
  <h1 id="vname"></h1>
  <p id="vstat"></p>
  <p id="vnext"></p>
</header>

<button id="join">내 집 받기</button>

<div id="card" class="box" hidden>
  <button class="x" aria-label="닫기">✕</button>
  <b id="cid"></b>
  <p id="cinfo"></p>
  <a id="clink" class="btn" target="_blank" rel="noopener">인스타에서 보기</a>
</div>

<form id="find" class="box">
  <input id="q" aria-label="내 아이디로 집 찾기" placeholder="내 아이디로 집 찾기" autocomplete="off" autocapitalize="off">
  <button>찾기</button>
</form>

<dialog id="how" class="box">
  <h2>집 받는 법</h2>
  <ol>
    <li>인스타 계정을 팔로우해요</li>
    <li>게시물에 <b id="kw"></b> 한 글자만 댓글로 남겨요</li>
    <li>돌판에 내 아이디가 새겨지고, 집 옆에 공룡 알이 하나 놓여요</li>
  </ol>
  <p>100번째 안에 들어온 집에는 금빛 깃발이 계속 달려 있어요. 팔로워가 늘면 마을 전체가 다음 시대로 넘어가요.</p>
  <div class="row">
    <button class="ghost" id="howx">닫기</button>
    <a class="btn" id="iglink" target="_blank" rel="noopener">인스타로 가기</a>
  </div>
</dialog>

<script type="module" src="./app.js?v=94e35fb0"></script>
</body>
</html>
